<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery Store Admin Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">

  <!-- Custom Styles -->
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/custom.css" />


 
</head>
<body class="dashboard">


  <!-- Header -->
  <header class=" text-white text-center p-4">
    <h1>Grocery Store Dashboard</h1>
    <p>Manage your store products and orders efficiently</p>
  </header>

 <!-- Main Content -->
  <main class="container mt-4">
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="card border-success">
          <div class="card-body">
            <h5 class="card-title">Manage Products</h5>
            <p class="card-text">Add, edit or delete grocery items.</p>
            <a href="manage-product.html" class="btn btn-custom">Go to Product Management</a>
          </div>
        </div>
      </div>

      <div class="col-md-6 mb-4">
        <div class="card border-warning">
          <div class="card-body">
            <h5 class="card-title">Orders</h5>
            <p class="card-text">View and update customer orders.</p>
            <a href="order.html" class="btn btn-custom">Go to Order Management</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-white py-3">
    &copy; 2025 Grocery Store Admin. All rights reserved.
  </footer>

  <!-- JS Scripts -->
  <script src="js/packages/jquery.min.js"></script>
  <script src="js/packages/bootstrap.min.js"></script>
  <script src="js/custom/common.js"></script>
  <script src="js/custom/dashboard.js"></script>
  <script src="js/custom/manage-product.js"></script>
  <script src="js/custom/order.js"></script>

</body>
</html>
