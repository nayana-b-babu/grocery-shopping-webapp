<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Products - Grocery Store Admin</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="../css/bootstrap.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/custom.css" />
   
</head>
<body class="manage-product">


  <!-- Header -->
  <header class="bg-success text-white text-center p-4">
    <h1>Manage Products</h1>
    <p>Add, edit or delete grocery items</p>
  </header>

  <!-- Navigation -->
<nav class="navbar navbar-light bg-light">
  <div class="container-fluid">
    <div class="d-flex justify-content-center w-100">
      <button class="nav-link active btn btn-link me-3" onclick="location.href='index.html'">Dashboard<span style='font-size:20px;'>&#129534;</span></button>
      <button class="nav-link btn btn-link me-3" onclick="location.href='manage-product.html'">Manage Products<span style='font-size:20px;'>&#129331;</span></button>
      <button class="nav-link btn btn-link" onclick="location.href='order.html'">Orders <span style="font-size: 20px;">&#128722;</span>
      </button>
    </div>
  </div>
</nav>




  <!-- Main Content -->
  <main class="container mt-4">

  <!-- Add Product Form -->
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">Add New Product</div>
      <div class="card-body">
        <form id="productForm">
          <div class="row g-3">
            <div class="col-md-4">
              <input type="text" class="form-control" id="productName" placeholder="Product Name" required />
            </div>
            <div class="col-md-4">
              <input type="number" class="form-control" id="productPrice" placeholder="Price (₹)" required />
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" id="productCategory" placeholder="Category" />
            </div>
            <div class="col-md-4">
            <select class="form-control" id="productUnit">
              <option value="" disabled selected>Select Unit</option>
              <option value="kg">Kilogram (kg)</option>
              <option value="liters">Liters(lit)</option>
              <option value="pcs">Pieces (pcs)</option>
              <option value="g">Grams (g)</option>
              </select>
            </div>
          <div class="mt-3">
            <button type="submit" class="btn btn-success">Add Product</button>
          </div>
          

        </form>
      </div>
    </div>

    <!-- Product List Table -->
    <div class="card">
      <div class="card-header bg-dark text-white">Product List</div>
      <div class="card-body p-0">
        <table class="table table-striped mb-0" id="productTable">
          <thead class="table-light">
           <tr>
           <th>Name</th>
           <th>Price (₹)</th>
           <th>Category</th>
            <th>Unit</th>
            <th>Action</th> <!-- ✅ Add this line -->
            </tr>
           </thead>

          <tbody>
            <!-- Product rows will be added dynamically via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>




  </main>

  <!-- Footer -->
  <footer class="text-center bg-dark text-white py-3 mt-5">
    &copy; 2025 Grocery Store Admin. All rights reserved.
  </footer>

  <!-- JS Files -->
  <script src="../js/packages/jquery.min.js"></script>
  <script src="../js/packages/bootstrap.min.js"></script>
  <script src="../js/custom/common.js"></script>
  <script src="../js/custom/dashboard.js"></script>
  <script src="../js/custom/manage-product.js"></script>
  <script src="../js/custom/order.js"></script>
</body>
</html>
